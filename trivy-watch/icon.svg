<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16606f"/>
      <stop offset="1" stop-color="#0a3540"/>
    </linearGradient>
    <!-- Corrugated container side: vertical ribs -->
    <pattern id="ribs" width="8" height="10" patternUnits="userSpaceOnUse">
      <rect x="5" y="0" width="3" height="10" fill="#000" fill-opacity="0.18"/>
    </pattern>
  </defs>

  <rect width="128" height="128" rx="26" fill="url(#bg)"/>

  <!-- Container -->
  <rect x="18" y="34" width="74" height="48" rx="4" fill="#8fd3df"/>
  <rect x="18" y="34" width="74" height="48" rx="4" fill="url(#ribs)"/>
  <rect x="18" y="34" width="74" height="7" rx="3" fill="#000" fill-opacity="0.15"/>

  <!-- Magnifier -->
  <circle cx="80" cy="78" r="20" fill="#0a3540" fill-opacity="0.55" stroke="#ffd166" stroke-width="7"/>
  <line x1="94.5" y1="92.5" x2="110" y2="108" stroke="#ffd166" stroke-width="10" stroke-linecap="round"/>
  <!-- A finding -->
  <circle cx="80" cy="78" r="5" fill="#ff6b6b"/>
</svg>
