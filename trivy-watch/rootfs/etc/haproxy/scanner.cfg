# Read-only Docker API proxy for the scanner: Trivy and trivy-watch talk to
# /run/docker-ro/docker.sock, never to the real socket. Allowlist of exactly what they call
# (captured from Trivy 0.75.0 scanning by image ID):
#   - _ping: the Docker client's API version negotiation;
#   - containers/json: trivy-watch's list of running containers;
#   - containers/{id}/json: trivy-watch's inspect, sent to inspect-redact.sh, which replaces
#     Config.Env -- Supervisor puts SUPERVISOR_TOKEN in every add-on's environment;
#   - images/{id}/json, images/{id}/history and images/get?names={id}: Trivy's inspect, history
#     and export, by full image ID only. The export (on a cache miss) hands over the whole image,
#     which is the point; no name forms, no second name, no other parameters.
# Every path may carry a /v1.NN prefix. Regexes use [.] rather than \. for a literal dot.
#
# The proxy only holds if the scanner can't reach the real socket another way: run.sh runs it as
# the unprivileged scanner user, and refuses to start if that user can open /run/docker.sock.
global
    log stdout format raw local0 info

defaults
    mode http
    log global
    option httplog
    timeout connect 5s
    # An export of a multi-GB image streams for minutes.
    timeout client 30m
    timeout server 30m

frontend docker_ro
    bind /run/docker-ro/docker.sock user scanner mode 600
    # The scanner works one image at a time.
    maxconn 4
    acl read_method method GET HEAD
    acl upgrade hdr(Upgrade) -m found
    acl allowed path_reg ^(/v1[.][0-9]+)?/_ping$
    acl allowed path_reg ^(/v1[.][0-9]+)?/containers/json$
    acl allowed path_reg ^(/v1[.][0-9]+)?/images/sha256(:|%3[Aa])[0-9a-f]{64}/(json|history)$
    acl inspect_path path_reg ^(/v1[.][0-9]+)?/containers/[^/]+/json$
    acl export_path path_reg ^(/v1[.][0-9]+)?/images/get$
    # path_reg never sees the query string. The whole query must be one name, an image ID; the
    # colon arrives URL-encoded.
    acl export_query query -m reg ^names=sha256(%3A|%3a|:)[0-9a-f]{64}$
    # Trivy first inspects an image ID as if it were a name on Docker Hub, and only retries with
    # the bare ID once that fails. Denied, but not worth a log line on every image of every scan.
    acl expected_miss path_reg ^(/v1[.][0-9]+)?/images/index[.]docker[.]io/library/sha256(:|%3[Aa])[0-9a-f]{64}/json$
    # Only denials reach the add-on log.
    http-request set-log-level silent if read_method allowed !upgrade
    http-request set-log-level silent if read_method inspect_path !upgrade
    http-request set-log-level silent if read_method export_path export_query !upgrade
    http-request set-log-level silent if expected_miss
    http-request deny unless read_method allowed !upgrade or read_method inspect_path !upgrade or read_method export_path export_query !upgrade
    use_backend inspect_redact if inspect_path
    default_backend docker

backend inspect_redact
    option http-server-close
    server redact /run/inspect-redact.sock

backend docker
    server dockerd /run/docker.sock
