# The add-on version is the Trivy version the image is built FROM, optionally with an "-rN" suffix
# for add-on-only changes, a new copy of trivy-watch.sh included (0.75.0, then 0.75.0-r1, ...).
# Renovate bumps this line and the Dockerfile's FROM together; CI fails if the two disagree.
name: Trivy watch
version: "0.75.0-r2"
slug: trivy_watch
description: Daily vulnerability scan of this host's add-on images, new findings sent to Teams
url: https://github.com/rgilijamse/ha-addons/tree/main/trivy-watch
arch:
  - amd64
  - aarch64
image: ghcr.io/rgilijamse/trivy-watch-{arch}
# Requires Protection mode off. The Docker socket is only ever reached through the read-only
# allowlist proxy in rootfs/etc/haproxy/scanner.cfg; Trivy and trivy-watch never see it directly.
docker_api: true
map:
  - type: addon_config
    read_only: false
# The vulnerability DB, Trivy's cache and image tarballs are re-created on the next scan; only the
# findings state (state/findings.tsv) is worth backing up.
backup_exclude:
  - "state/cache/*"
  - "state/run/*"
  - "tmp/*"
# The two URLs are listed here (empty) only so the UI shows them: optional options without a
# default are hidden behind "Show unused optional configuration options". run.sh refuses to start
# without them unless dry_run is on.
options:
  teams_webhook_url: ""
  hc_ping_url: ""
  host_label: hassio
  run_at: "05:00"
  digest_day: 1
  extra_env: []
  dry_run: false
schema:
  teams_webhook_url: password?
  hc_ping_url: password?
  host_label: str
  run_at: match(^([01][0-9]|2[0-3]):[0-5][0-9]$)
  digest_day: int(1,7)
  extra_env:
    - match(^[A-Za-z_][A-Za-z0-9_]*=.*$)
  dry_run: bool
