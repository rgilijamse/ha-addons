name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    strategy:
      matrix:
        addon: [komodo-periphery, trivy-watch]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: frenck/action-addon-linter@v2
        with:
          path: ./${{ matrix.addon }}

  build:
    needs: lint
    strategy:
      matrix:
        addon: [komodo-periphery, trivy-watch]
        arch: [amd64, aarch64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      ADDON: ${{ matrix.addon }}
    steps:
      - uses: actions/checkout@v7

      - name: Read version
        id: version
        run: |
          version="$(yq -r .version "$ADDON/config.yaml")"
          echo "addon=$version" >> "$GITHUB_OUTPUT"
          # 2.3.3-r1 -> 2.3.3: the -rN suffix marks add-on-only changes.
          echo "upstream=${version%-r*}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER}/${ADDON}-${{ matrix.arch }}" >> "$GITHUB_OUTPUT"

      # trivy-watch pins Trivy by tag and digest in its Dockerfile, so the add-on version can't
      # drive the FROM line as a build arg. Renovate bumps both; this catches a half-done bump.
      - name: Check the Dockerfile matches the version
        if: matrix.addon == 'trivy-watch'
        run: |
          from="$(sed -n 's|^FROM aquasec/trivy:\([^@]*\)@.*|\1|p' "$ADDON/Dockerfile")"
          if [ "$from" != "${{ steps.version.outputs.upstream }}" ]; then
            echo "::error::Dockerfile is FROM aquasec/trivy:$from, config.yaml says ${{ steps.version.outputs.addon }}"
            exit 1
          fi

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Releases are immutable: a version already in the registry is never overwritten, so
      # Supervisor never has a stale copy of a tag. Bump the version to release a change. The one
      # moving tag is `latest`, below.
      - name: Check whether this version is already released
        id: released
        if: github.event_name != 'pull_request'
        run: |
          if docker manifest inspect "${{ steps.version.outputs.image }}:${{ steps.version.outputs.addon }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: ${{ env.ADDON }}
          load: true
          tags: ${{ steps.version.outputs.image }}:${{ steps.version.outputs.addon }}
          build-args: |
            PERIPHERY_VERSION=${{ steps.version.outputs.upstream }}
            BUILD_VERSION=${{ steps.version.outputs.addon }}
            BUILD_ARCH=${{ matrix.arch }}

      - name: Smoke test
        run: |
          image="${{ steps.version.outputs.image }}:${{ steps.version.outputs.addon }}"
          case "$ADDON" in
            komodo-periphery)
              docker run --rm --entrypoint haproxy "$image" -c -f /etc/haproxy/docker-ro.cfg
              docker run --rm --entrypoint periphery "$image" --version
              ;;
            trivy-watch)
              docker run --rm --entrypoint haproxy "$image" -c -f /etc/haproxy/scanner.cfg
              docker run --rm --entrypoint trivy "$image" --version
              docker run --rm --entrypoint sh "$image" -c 'bash -n /run.sh && sh -n /usr/local/bin/trivy-watch'
              ;;
          esac

      - name: Push
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.released.outputs.exists == 'false'
        run: docker push "${{ steps.version.outputs.image }}:${{ steps.version.outputs.addon }}"

      # `latest` follows the version in config.yaml on main, for running the image outside
      # Supervisor. It is copied in the registry from the released version tag rather than pushed
      # from this build, so it is always that release's image, also on a run that released nothing.
      - name: Point latest at this version
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          image="${{ steps.version.outputs.image }}"
          docker buildx imagetools create --tag "$image:latest" "$image:${{ steps.version.outputs.addon }}"
