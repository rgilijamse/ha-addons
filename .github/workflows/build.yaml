name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  ADDON: komodo-periphery

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: frenck/action-addon-linter@v2
        with:
          path: ./${{ env.ADDON }}

  build:
    needs: lint
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Read version
        id: version
        run: |
          version="$(yq -r .version "$ADDON/config.yaml")"
          echo "addon=$version" >> "$GITHUB_OUTPUT"
          # 2.3.3-r1 -> 2.3.3: the -rN suffix marks add-on-only changes.
          echo "upstream=${version%-r*}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER}/${ADDON}-${{ matrix.arch }}" >> "$GITHUB_OUTPUT"

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Releases are immutable: a version already in the registry is never overwritten, so
      # Supervisor never has a stale copy of a tag. Bump the version to release a change.
      - name: Check whether this version is already released
        id: released
        if: github.event_name != 'pull_request'
        run: |
          if docker manifest inspect "${{ steps.version.outputs.image }}:${{ steps.version.outputs.addon }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: ${{ env.ADDON }}
          load: true
          tags: ${{ steps.version.outputs.image }}:${{ steps.version.outputs.addon }}
          build-args: |
            PERIPHERY_VERSION=${{ steps.version.outputs.upstream }}
            BUILD_VERSION=${{ steps.version.outputs.addon }}
            BUILD_ARCH=${{ matrix.arch }}

      - name: Smoke test
        run: |
          image="${{ steps.version.outputs.image }}:${{ steps.version.outputs.addon }}"
          docker run --rm --entrypoint haproxy "$image" -c -f /etc/haproxy/docker-ro.cfg
          docker run --rm --entrypoint periphery "$image" --version

      - name: Push
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.released.outputs.exists == 'false'
        run: docker push "${{ steps.version.outputs.image }}:${{ steps.version.outputs.addon }}"
