# Read-only Docker API proxy: Periphery talks to /run/docker-ro/docker.sock, never to the real
# socket. Allowlist rather than "GET only": several GET routes are not harmless.
#   - /containers/{id}/json (inspect) returns every container's environment, and Supervisor puts
#     SUPERVISOR_TOKEN in every add-on's environment.
#   - /containers/{id}/attach/ws is a GET websocket that can write to stdin.
#   - /containers/{id}/archive, /containers/{id}/export and /images/{name}/get copy out entire
#     filesystems.
# Periphery's own polling only needs _ping, containers/json and containers/{id}/stats.
# The proxy only holds if Periphery can't reach the real socket another way: run.sh runs it as the
# unprivileged periphery user, and refuses to start if that user can open /run/docker.sock.
#
# One opt-in write: with the allow_volume_prune option (ALLOW_VOLUME_PRUNE=true), a volume prune is
# let through with its query string dropped. Komodo sends filters={"all":...}, which would also
# remove unused *named* volumes; without filters Docker removes only unused *anonymous* ones, which
# nothing ever re-attaches. That default only holds from API v1.42 on (older versions prune named
# volumes too), so unversioned and older paths stay denied.
global
    log stdout format raw local0 info

defaults
    mode http
    log global
    option httplog
    timeout connect 5s
    # /events and log follows are long-lived streams.
    timeout client 1h
    timeout server 1h

frontend docker_ro
    bind /run/docker-ro/docker.sock user periphery mode 600
    acl read_method method GET HEAD
    acl upgrade hdr(Upgrade) -m found
    acl allowed path_reg ^(/v1\.[0-9]+)?/(_ping|version|info|events|system/df)$
    acl allowed path_reg ^(/v1\.[0-9]+)?/containers/json$
    acl allowed path_reg ^(/v1\.[0-9]+)?/containers/[^/]+/(stats|logs|top)$
    acl allowed path_reg ^(/v1\.[0-9]+)?/images/json$
    acl allowed path_reg ^(/v1\.[0-9]+)?/(networks|volumes)(/[^/]+)?$
    acl post_method method POST
    acl volume_prune_path path_reg ^/v1\.(4[2-9]|[5-9][0-9])/volumes/prune$
    acl volume_prune_enabled env(ALLOW_VOLUME_PRUNE) -m str true
    # Only denied requests and prunes reach the add-on log; allowed polling every few seconds
    # would drown it.
    http-request set-log-level silent if read_method allowed !upgrade
    http-request set-uri %[path] if post_method volume_prune_path volume_prune_enabled
    http-request deny unless read_method allowed !upgrade or post_method volume_prune_path volume_prune_enabled !upgrade
    default_backend docker

backend docker
    server dockerd /run/docker.sock
