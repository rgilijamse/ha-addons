<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#20456e"/>
      <stop offset="1" stop-color="#11263f"/>
    </linearGradient>
    <!-- Corrugated container side: vertical ribs -->
    <pattern id="ribs" width="8" height="10" patternUnits="userSpaceOnUse">
      <rect x="5" y="0" width="3" height="10" fill="#000" fill-opacity="0.18"/>
    </pattern>
  </defs>

  <rect width="128" height="128" rx="26" fill="url(#bg)"/>

  <g transform="translate(-4 -7)">

  <!-- Top container -->
  <g transform="translate(32 28)">
    <rect width="68" height="30" rx="3" fill="#8fd0f5"/>
    <rect x="4" y="4" width="60" height="22" fill="url(#ribs)"/>
    <rect width="68" height="30" rx="3" fill="none" stroke="#5aa9d8" stroke-width="2"/>
  </g>

  <!-- Bottom container -->
  <g transform="translate(16 62)">
    <rect width="80" height="32" rx="3" fill="#4d9fd6"/>
    <rect x="4" y="4" width="72" height="24" fill="url(#ribs)"/>
    <rect width="80" height="32" rx="3" fill="none" stroke="#2f7fb6" stroke-width="2"/>
  </g>

  <!-- Eye badge: watches, never touches -->
  <circle cx="96" cy="96" r="25" fill="#11263f"/>
  <circle cx="96" cy="96" r="20" fill="#f6b73c"/>
  <path d="M80 96 Q96 82 112 96 Q96 110 80 96 Z" fill="#11263f"/>
  <circle cx="96" cy="96" r="6" fill="#f6b73c"/>
  <circle cx="96" cy="96" r="2.6" fill="#11263f"/>
  </g>
</svg>
